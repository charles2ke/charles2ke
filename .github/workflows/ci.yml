name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Links can break without a commit (a renamed repository, a page that
    # stops being published), so re-run the checks weekly.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest ruff

      - name: Lint with ruff
        run: ruff check scripts/ tests/

      - name: Run tests
        run: python -m pytest tests/ -v
