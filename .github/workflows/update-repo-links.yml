name: Update repository links

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - repo-created
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/update_repo_links.py
      - .github/workflows/update-repo-links.yml
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh repository links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_repo_links.py

      - name: Propose refreshed repository links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/update-repo-links
        run: |
          if git diff --quiet -- README.md; then
            echo "README repository links are already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base_sha="$(git rev-parse HEAD)"
          file_sha="$(git rev-parse HEAD:README.md)"

          # Point the working branch at the current base commit, creating it if needed.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" \
              -f sha="$base_sha" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$BRANCH" -f sha="$base_sha" >/dev/null
          fi

          # Commit through the API so the commit carries a verified signature.
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/README.md" \
            -f message="Update repository links" \
            -f branch="$BRANCH" \
            -f sha="$file_sha" \
            -f content="$(base64 -w0 README.md)" >/dev/null

          pr_url="$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --head "$BRANCH" --base main \
              --title "Update repository links" \
              --body "Automated refresh of the repository links in README.md.")"
          fi

          echo "README repository links were updated in $pr_url." >> "$GITHUB_STEP_SUMMARY"
