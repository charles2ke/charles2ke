name: Update repository links

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - repo-created
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/update_repo_links.py
      - .github/workflows/update-repo-links.yml
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh repository links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_repo_links.py

      - name: Commit refreshed repository links
        run: |
          if git diff --quiet -- README.md; then
            echo "README repository links are already up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update repository links"
            git push
            echo "README repository links were updated." >> "$GITHUB_STEP_SUMMARY"
          fi
