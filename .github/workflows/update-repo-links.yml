name: Update repository links

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/update_repo_links.py
      - .github/workflows/update-repo-links.yml
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh repository links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_repo_links.py

      - name: Raise PR on findings
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/update-repo-links
          commit-message: "chore: update repository links"
          title: "chore: auto-update repository links"
          body: |
            Automated update from the scheduled `update-repo-links` workflow.

            New or updated repositories were detected and the README has been refreshed.

            ## Checklist

            - [x] Scope is complete and minimal
            - [x] Diff has been reviewed for unrelated changes
            - [x] No secrets or sensitive data are included
            - [x] Documentation has been updated if behavior changed
          labels: automated
          delete-branch: true
