name: Update repository links

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/update_repo_links.py
      - .github/workflows/update-repo-links.yml
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh repository links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_repo_links.py

      - name: Report repository link changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README repository links are already up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "README repository links need to be updated."
              echo
              echo "The generated diff is shown below. Repository rules prevent this workflow from pushing an automated branch."
              echo
              echo '```diff'
              git diff -- README.md
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
