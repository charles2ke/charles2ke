name: Package and Release

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build package archive
        run: |
          VERSION="$(date -u +%Y%m%d-%H%M%S)"
          ARCHIVE="profile-package-${VERSION}.tar.gz"

          tar -czf "${ARCHIVE}" \
            README.md \
            scripts/ \
            .github/workflows/

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: profile-package-${{ env.VERSION }}
          path: ${{ env.ARCHIVE }}
          retention-days: 30
